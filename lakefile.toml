name = "SFL"
version = "0.1.0"
license = "Apache-2.0"
defaultTargets = ["sfl-lf", "sfl-hl", "sfl-ts"]

# Release facts, threaded into the book text through the roles in
# `SFLMeta/Version.lean` (`{sflVersion}[]`, `{sflYear}[]`) so that no chapter
# ever spells a version or year out by hand.  `weak.sfl.version` must be kept in
# step with the package `version` above; `weak.sfl.year` is the year the current
# edition is released, deliberately recorded rather than read from the clock, so
# that two builds of the same tag agree.  See CONTRIBUTING.md, "Volumes and
# Versions".
[leanOptions]
weak.verso.code.warnLineLength = 0 # 0 disables warnings; consider setting to 70
weak.sfl.version = "0.1.0"
weak.sfl.year = 2026

# [[require]]
# name = "mathlib"
# scope = "leanprover-community"
# rev = "v4.30.0"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
# This Verso revision targets 4.34.0-rc2 but is also backwards-compatible with
# 4.33. It pushes the SubVerso dependency to a version with performance
# improvements, and it uses some improved APIs.
#
# When updating to Lean v4.34.0, replace this string with "v4.34.0" to get its
# tagged Verso release, which will also include all of these improvements.
# In the meantime, instead of `lake update`, use `lake update --keep-toolchain`
# so it doesn't attempt to update your toolchain pin to match Verso's.
rev = "17c820e9726faeea24cbe6e6532b6b6e8452cc52"

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "v4.34.0-rc2"

[[require]]
name = "comparator-autograder"
git = "https://github.com/plclub/comparator-autograder"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "Bib"

# Single shared source for the Credits section included in each
# volume's Preface.  Its own library because globs are disabled below, so a
# module is only built when it is a declared library root.
[[lean_lib]]
name = "Credits"

[[lean_lib]]
name = "SFLMeta"

[[lean_lib]]
name = "SFLCompat"

# Each volume library tells its chapters which volume they belong to; the
# `volumes` table in `SFLMeta/Volume.lean` turns the slug into a number and a
# title.  This has to be a per-library option rather than something a chapter
# imports: chapters shared between volumes are literally the same file (a
# symlinked `HL/Slang.lean` <-> `TS/Slang.lean`), so the compiling library is
# the only thing that can tell them apart.
[[lean_lib]]
name = "LF"
leanOptions = { weak.sfl.volume = "lf" }
# CGH: I'm disabling globs because we need a successful build for Verso,
# which is not the case for current `main`
# globs = ["LF.+"]

[[lean_lib]]
name = "HL"
leanOptions = { weak.sfl.volume = "hl" }

[[lean_lib]]
name = "TS"
leanOptions = { weak.sfl.volume = "ts" }

# One executable per volume.  Keeping the volumes in separate executables means
# no single module imports more than one volume root, so chapters shared across
# volumes (a symlinked `HL/Slang.lean` ↔ `TS/Slang.lean`) don't collide on their
# `namespace` declarations.  Each is invoked as: lake exe sfl-<vol> <mode>
[[lean_exe]]
name = "sfl-lf"
root = "TargetsLF"

[[lean_exe]]
name = "sfl-hl"
root = "TargetsHL"

[[lean_exe]]
name = "sfl-ts"
root = "TargetsTS"

# Temporary scaffolding: draft book + executable that emits solutions .lean for
# generated LF/<Ch>Verso.lean chapters not yet in the real book, so they can be
# diffed against the bare LF/<Ch>.lean sources.  See LFDraft.lean.
[[lean_lib]]
name = "LFDraft"
leanOptions = { weak.sfl.volume = "lf" }

[[lean_exe]]
name = "sfl-draft"
root = "TargetsDraft"
